baseURL: https://hectorvent.dev/
languageCode: en-us
title: Hector Ventura
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: true

markup:
  goldmark:
    renderer:
      unsafe: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Hector Ventura
  description: Software Engineer & Developer
  author: Hector Ventura
  email: hectorvent@gmail.com
  defaultTheme: auto
  ShowReadingTime: true

  # Default image used for social link previews (Open Graph / Twitter / Slack / LinkedIn)
  # when a page has no usable raster cover. Must be an absolute path to a PNG/JPG.
  images: ["/images/og-default.png"]

  social:
    twitter: hectorvent

  profileMode:
    enabled: true
    title: Hector Ventura
    subtitle: "Software Engineer"
    imageUrl: "/images/hector_perfile.png"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Blog
        url: /posts/
      - name: Projects
        url: /projects/

  sponsor:
    text: "I build free, MIT-licensed open-source tools like the Floci cloud emulators. If they save you time, please consider supporting their development."
    links:
      - name: Sponsor on GitHub
        url: https://github.com/sponsors/hectorvent
      - name: Donate via PayPal
        url: https://paypal.me/hectorvent

  socialIcons:
    - name: github
      url: "https://github.com/hectorvent"
    - name: linkedin
      url: "https://linkedin.com/in/hectorvent"
    - name: twitter
      url: "https://twitter.com/hectorvent"
    - name: bluesky
      url: "https://bsky.app/profile/hectorvent.dev"
    - name: telegram
      url: "https://t.me/hectorvent"

  assets:
    favicon: "/images/favicon.ico"
    favicon16x16: "/images/favicon-16x16.png"
    favicon32x32: "/images/favicon-32x32.png"
    apple_touch_icon: "/images/apple-touch-icon.png"
    safari_pinned_tab: "/images/apple-touch-icon.png"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 20
    - identifier: presentations
      name: Presentations
      url: /presentations/
      weight: 25
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 35
    - identifier: search
      name: Search
      url: /search/
      weight: 40
