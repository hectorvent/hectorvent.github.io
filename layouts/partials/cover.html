{{- with .cxt}} {{/* Apply proper context from dict */}}
{{- if (and .Params.cover.image (not $.isHidden)) }}
{{- $page := . }}
<figure class="entry-cover{{ with .Params.cover.imageDark }} entry-cover--themed{{ end }}">
    {{- $loading := cond $.IsSingle "eager" "lazy" }}
    {{- $addLink := (and site.Params.cover.linkFullImages $.IsSingle) }}
    {{- $prod := (hugo.IsProduction | or (eq site.Params.env "production")) }}
    {{- $alt := (.Params.cover.alt | default .Params.cover.caption | plainify) }}
    {{- $responsiveImages := (.Params.cover.responsiveImages | default site.Params.cover.responsiveImages) | default true }}

    {{- $sizes := (slice "360" "480" "720" "1080" "1500") }}
    {{- $processableFormats := (slice "jpg" "jpeg" "png" "tif" "bmp" "gif") -}}
    {{- if hugo.IsExtended -}}
        {{- $processableFormats = $processableFormats | append "webp" -}}
    {{- end -}}

    {{- /* Build the list of images to render. A second, dark-mode variant is added */}}
    {{- /* when cover.imageDark is set; CSS swaps them based on html[data-theme]. */}}
    {{- $images := slice (dict "src" .Params.cover.image "class" (cond (ne (string .Params.cover.imageDark) "") "cover-light" "")) }}
    {{- with .Params.cover.imageDark }}
        {{- $images = $images | append (dict "src" . "class" "cover-dark") }}
    {{- end }}

    {{- $linkdl := (.Params.cover.image) | absURL }}
    {{- $linkCover := (or (($page.Resources.ByType "image").GetMatch (printf "*%s*" .Params.cover.image)) ((resources.ByType "image").GetMatch (printf "*%s*" .Params.cover.image))) }}
    {{- with $linkCover }}{{ $linkdl = .Permalink }}{{ end }}

    {{- if $addLink }}
        <a href="{{ $linkdl }}" target="_blank" rel="noopener noreferrer">
    {{- end }}

    {{- range $img := $images }}
        {{- $src := $img.src }}
        {{- $class := $img.class }}
        {{- $pageBundleCover := ($page.Resources.ByType "image").GetMatch (printf "*%s*" $src) }}
        {{- $globalResourcesCover := (resources.ByType "image").GetMatch (printf "*%s*" $src) }}
        {{- $cover := (or $pageBundleCover $globalResourcesCover) }}

        {{- $imgdl := $src | absURL }}
        {{- if $cover -}}
            {{- $imgdl = $cover.Permalink }}
        {{- end -}}

        {{- if $cover -}}
            {{/* i.e it is present in page bundle */}}
            {{- if (and (in $processableFormats $cover.MediaType.SubType) ($responsiveImages) (eq $prod true)) }}
                <img class="{{ $class }}" loading="{{$loading}}"
                    srcset='{{- range $size := $sizes -}}
                                {{- if (ge $cover.Width $size) }}
                                    {{- printf "%s %s" (($cover.Resize (printf "%sx" $size)).Permalink) (printf "%sw," $size) }}
                                {{- end }}
                            {{- end }}
                            {{- printf "%s %dw" ($cover.Permalink) ($cover.Width) }}'
                    src="{{ $cover.Permalink }}"
                    sizes="(min-width: 768px) 720px, 100vw"
                    width="{{ $cover.Width }}" height="{{ $cover.Height }}"
                    alt="{{ $alt }}">
            {{- else }}{{/* Unprocessable image or responsive images disabled */}}
                <img class="{{ $class }}" loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}">
            {{- end }}
        {{- else }}
            {{- /* For absolute urls and external links, no img processing here */}}
            <img class="{{ $class }}" loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}">
        {{- end }}
    {{- end }}

    {{- if $addLink }}
        </a>
    {{- end -}}

    {{- /*  Display Caption  */}}
    {{- if $.IsSingle }}
        {{ with .Params.cover.caption -}}
            <figcaption>{{ . | markdownify }}</figcaption>
        {{- end }}
    {{- end }}
</figure>
{{- end }}{{/* End image */}}
{{- end -}}{{/* End context */ -}}
